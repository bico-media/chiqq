name: Performance

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Arguments for run.sh, e.g. --runtimes node --libs chiqq,p-queue'
        required: false
        default: '--runtimes node,bun'

permissions: read-all

jobs:
  benchmark:
    name: Compare with similar libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Run benchmark
        env:
          ARGS: ${{ inputs.args }}
        run: test/performance/run.sh $ARGS

      - name: Show results
        run: cat test/performance/results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-results
          path: test/performance/results.md
