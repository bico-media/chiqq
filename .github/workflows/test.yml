name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  test:
    name: Test suite (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run test-format

      - name: Typecheck
        run: bun run typecheck

      - name: Run test suite
        run: bun test

      - name: Build
        run: bun run build

      - name: Check package types with attw
        run: bun run test-types

  dist:
    name: Build and consume on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Import as ESM and require as CJS
        run: bun run test-dist
